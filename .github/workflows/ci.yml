name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR pushes; never cancel main so every main commit is fully validated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      sandbox: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        name: Detect code and sandbox smoke changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BASE"
            head="$GITHUB_SHA_VALUE"
          fi
          scripts/ci-code-changes-required.sh "$base" "$head" | tee -a "$GITHUB_OUTPUT"
          scripts/ci-sandbox-smoke-required.sh "$base" "$head" | tee -a "$GITHUB_OUTPUT"

  test-rest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests (all packages except internal/daemon)
        run: make test-ci-rest

  test-daemon:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests (internal/daemon shard ${{ matrix.shard }}/4)
        run: scripts/ci-go-test-daemon-shard.sh ${{ matrix.shard }} 4

  concurrency:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Runtime concurrency contracts
        run: make test-concurrency

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web build helper tests
        run: node --test scripts/web-build.test.mjs
      - name: Vite browser proxy contract
        run: node --test scripts/vite-proxy.test.mjs
      - name: Claude SDK bridge tests
        run: node --test cmd/pentest-claude-sdk-bridge/bridge.test.mjs
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Build UI (embed path is local-only, not committed)
        run: make build-ui

  # Browser tests run beside lint/unit/build instead of after them.
  web-browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Resolve Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser + OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install browser OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Browser tests
        working-directory: web
        run: npm run test:browser

  windows-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - name: Disable Defender real-time scanning (ephemeral runner; npm/go file I/O)
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop; "Defender real-time scanning disabled" }
          catch { Write-Warning "Could not disable Defender real-time scanning: $_" }
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test native Windows web build helper
        shell: cmd
        run: node --test scripts/web-build.test.mjs
      - name: Build native Windows daemon
        shell: cmd
        run: |
          node scripts/web-build-cli.mjs build-ui
          go build -o pentestd.exe ./cmd/pentestd
      - name: Verify native executable
        shell: cmd
        run: if not exist pentestd.exe exit /b 1

  # Go tests on Windows do not need the real UI build or setup-node (the embed
  # stub only needs the preinstalled node), so they run beside windows-build.
  windows-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - name: Disable Defender real-time scanning (ephemeral runner; npm/go file I/O)
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop; "Defender real-time scanning disabled" }
          catch { Write-Warning "Could not disable Defender real-time scanning: $_" }
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          node scripts/web-build-cli.mjs ensure-embed-stub
          go test -timeout 20m $(go list ./cmd/... ./internal/... | grep -vxF 'pentest/internal/daemon' | grep -vxF 'pentest/internal/runner')

  app-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/pentestd/Dockerfile
          platforms: linux/amd64
          push: false
          tags: cyberpenda-app:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha,scope=pentestd-app
          cache-to: type=gha,mode=max,scope=pentestd-app

  smoke-sandbox-fgs:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build sandbox smoke probe image
        run: make build-sandbox-smoke-image
      - name: Smoke sandbox FGS (no LLM)
        env:
          PENTEST_SANDBOX_IMAGE: cyberpenda-sandbox-smoke:ci
          SANDBOX_IMAGE: cyberpenda-sandbox-smoke:ci
        run: make smoke-sandbox-fgs

  # Always runs so docs-only PRs do not leave required checks pending if protection is added later.
  ci-result:
    needs:
      - changes
      - test-rest
      - test-daemon
      - concurrency
      - web
      - web-browser
      - windows-build
      - windows-test
      - app-image
      - smoke-sandbox-fgs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI result
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          TEST_REST: ${{ needs.test-rest.result }}
          TEST_DAEMON: ${{ needs.test-daemon.result }}
          CONCURRENCY: ${{ needs.concurrency.result }}
          WEB: ${{ needs.web.result }}
          WEB_BROWSER: ${{ needs.web-browser.result }}
          WINDOWS: ${{ needs.windows-build.result }}
          WINDOWS_TEST: ${{ needs.windows-test.result }}
          APP_IMAGE: ${{ needs.app-image.result }}
          SANDBOX: ${{ needs.changes.outputs.sandbox }}
          SMOKE: ${{ needs.smoke-sandbox-fgs.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "changes job failed: $CHANGES" >&2
            exit 1
          fi
          if [ "$CODE" != "true" ]; then
            echo "docs-only change; code jobs skipped"
            exit 0
          fi
          fail=0
          for pair in \
            "test-rest:$TEST_REST" \
            "test-daemon:$TEST_DAEMON" \
            "concurrency:$CONCURRENCY" \
            "web:$WEB" \
            "web-browser:$WEB_BROWSER" \
            "windows-build:$WINDOWS" \
            "windows-test:$WINDOWS_TEST" \
            "app-image:$APP_IMAGE"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              echo "$name => $result" >&2
              fail=1
            fi
          done
          # smoke runs only when sandbox paths changed; then it must pass.
          if [ "$SANDBOX" = "true" ]; then
            want="success"
          else
            want="skipped"
          fi
          if [ "$SMOKE" != "$want" ]; then
            echo "smoke-sandbox-fgs => $SMOKE (expected $want)" >&2
            fail=1
          fi
          exit "$fail"
